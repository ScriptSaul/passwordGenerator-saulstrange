<html>
    <head>
        <link rel="stylesheet" href="./index.css">
    </head>
    <body>
        <div class="flex-column-section">
            <h1>Generate a<br><span id="highlight-text">random password</span></h1>
            <h2>Never use an insecure password again.</h2>
            <label for="password-length">Password Length:</label>
            <input type="number" id="password-length" min="8" max="16" value="8">
            <br>
            <br>
            <button id="generate-btn" onclick="generatePasswords()">Generate passwords</button>
        </div>
        <div class="two-column-layout">
            <p id="password-output1" onclick="copyToClipboard(this.textContent)"></p>
            <p id="password-output2" onclick="copyToClipboard(this.textContent)"></p>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
